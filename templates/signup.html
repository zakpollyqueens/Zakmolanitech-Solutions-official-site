<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account | Zakmolanitech Solutions</title>
<link rel="stylesheet" href="../static/css/main.css">

<style>
.auth-page{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:40px 16px;
}

.auth-wrap{
    width:min(100%,520px);
}

.auth-card{
    padding:30px 24px;
    border:1px solid var(--line);
    border-radius:24px;
    background:var(--surface-strong);
    box-shadow:var(--shadow);
}

.auth-heading{
    text-align:center;
    margin-bottom:25px;
}

.auth-heading h1{
    font-size:clamp(30px,5vw,46px);
}

.auth-heading p{
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
}

.auth-field{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-bottom:16px;
}

.auth-field label{
    font-size:11px;
    font-weight:800;
    letter-spacing:1px;
}

.auth-field input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(5,11,20,.7);
    color:var(--text);
    font:inherit;
    outline:none;
}

.auth-field input:focus{
    border-color:var(--line-bright);
}

.auth-check{
    display:flex;
    gap:9px;
    margin:8px 0 20px;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}

.auth-submit{
    width:100%!important;
    height:52px!important;
}

.auth-submit:disabled{
    opacity:.6;
}

.auth-status{
    min-height:22px;
    margin-top:15px;
    text-align:center;
    color:var(--muted);
    font-size:12px;
}

.auth-footer{
    text-align:center;
    margin-top:22px;
    padding-top:20px;
    border-top:1px solid var(--line);
    color:var(--muted);
    font-size:13px;
}

.auth-footer a{
    color:var(--cyan);
    text-decoration:none;
    font-weight:800;
}
</style>
</head>

<body>

<main class="auth-page">

<div class="auth-wrap">

<div class="auth-card">

<div class="auth-heading">
<div class="eyebrow">ACCOUNT / 01</div>
<h1>Create your <span>account.</span></h1>
<p>Create your Zakmolanitech Solutions account securely.</p>
</div>

<form id="signupForm" novalidate>

<div class="auth-field">
<label for="name">FULL NAME</label>
<input
    id="name"
    type="text"
    autocomplete="name"
    required
>
</div>

<div class="auth-field">
<label for="email">EMAIL ADDRESS</label>
<input
    id="email"
    type="email"
    autocomplete="email"
    required
>
</div>

<div class="auth-field">
<label for="phone">PHONE / WHATSAPP</label>
<input
    id="phone"
    type="tel"
    autocomplete="tel"
    required
>
</div>

<div class="auth-field">
<label for="password">PASSWORD</label>
<input
    id="password"
    type="password"
    autocomplete="new-password"
    minlength="8"
    required
>
</div>

<label class="auth-check">
<input id="terms" type="checkbox" required>
<span>
I agree to use this account responsibly and accept the site's terms.
</span>
</label>

<button
    id="signupButton"
    class="btn btn-primary auth-submit"
    type="submit"
>
CREATE MY ACCOUNT
</button>

<p
    id="signupStatus"
    class="auth-status"
    aria-live="polite"
></p>

</form>

<div class="auth-footer">
Already have an account?
<a href="signin.html">SIGN IN</a>
</div>

</div>
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabase = window.supabase.createClient(
    "https://julhswsijtcoyjrjrobk.supabase.co",
    "sb_publishable_a0qKsqBB0hR9BOWpP3dkwg_7nUOmXYC"
);

const form = document.getElementById("signupForm");
const button = document.getElementById("signupButton");
const status = document.getElementById("signupStatus");

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const phoneInput = document.getElementById("phone");
const passwordInput = document.getElementById("password");
const terms = document.getElementById("terms");

function showStatus(message, success = false){

    status.textContent = message;

    status.style.color =
        success ? "var(--cyan)" : "#ff8a8a";
}

form.addEventListener("submit", async function(event){

    event.preventDefault();
    event.stopPropagation();

    const name = nameInput.value.trim();
    const email = emailInput.value.trim().toLowerCase();
    const phone = phoneInput.value.trim();
    const password = passwordInput.value;

    if(!name){
        showStatus("Please enter your full name.");
        return;
    }

    if(!email || !emailInput.checkValidity()){
        showStatus("Please enter a valid email address.");
        return;
    }

    if(!phone){
        showStatus("Please enter your phone number.");
        return;
    }

    if(password.length < 8){
        showStatus("Password must contain at least 8 characters.");
        return;
    }

    if(!terms.checked){
        showStatus("Please accept the terms.");
        return;
    }

    button.disabled = true;
    button.textContent = "CREATING ACCOUNT...";

    showStatus("Creating your account...", true);

    try{

        const { data, error } =
            await supabase.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {
                        full_name: name,
                        phone: phone
                    },

                    emailRedirectTo:
                        "https://zakpollyqueens.github.io/Zakmolanitech-Solutions-official-site/templates/signin.html"
                }
            });

        console.log("SIGNUP RESULT:", data);
        console.log("SIGNUP ERROR:", error);

        if(error){
            throw error;
        }

        if(!data || !data.user){
            throw new Error(
                "Account creation failed. Supabase did not return a user."
            );
        }

        /*
         * IMPORTANT:
         *
         * If email confirmation is enabled,
         * data.session will normally be null.
         *
         * In that case DO NOT redirect.
         */

        if(!data.session){

            showStatus(
                "Account created successfully. Please check your email, confirm your account, then sign in.",
                true
            );

            form.reset();

            button.disabled = false;
            button.textContent = "CREATE MY ACCOUNT";

            return;
        }

        /*
         * If Supabase actually gives us a session,
         * then the user is already authenticated.
         */

        showStatus(
            "Account created successfully. Opening dashboard...",
            true
        );

        window.location.replace("dashboard.html");

    }catch(error){

        console.error("SIGNUP ERROR:", error);

        showStatus(
            error?.message ||
            "Unable to create your account."
        );

        button.disabled = false;
        button.textContent = "CREATE MY ACCOUNT";
    }

});

</script>

</body>
  </html>
