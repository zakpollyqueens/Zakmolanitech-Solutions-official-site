<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In | Zakmolanitech Solutions</title>
<meta name="description" content="Sign in to your Zakmolanitech Solutions account.">
<meta name="theme-color" content="#050b14">
<link rel="stylesheet" href="../static/css/main.css">

<style>
.account-page{
  min-height:100vh;
  padding:105px 20px 60px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.account-wrap{width:min(520px,100%)}
.account-logo{text-align:center;margin-bottom:25px}
.account-logo img{
  width:72px;
  height:72px;
  object-fit:contain;
  border-radius:18px;
}
.account-card{
  padding:38px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:linear-gradient(145deg,rgba(9,25,43,.9),rgba(5,14,25,.82));
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px);
}
.account-card h1{
  font-size:clamp(34px,6vw,50px);
  letter-spacing:-2px;
  line-height:1;
}
.intro{
  margin:12px 0 28px;
  color:var(--muted);
}
.form-field{margin-bottom:18px}
.form-field label{
  display:block;
  margin-bottom:8px;
  color:var(--text);
  font-size:11px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
}
.form-field input{
  width:100%;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(5,11,20,.7);
  color:var(--text);
  outline:0;
  box-sizing:border-box;
}
.form-field input:focus{
  border-color:var(--line-bright);
  box-shadow:0 0 0 3px rgba(70,230,255,.08);
}
.submit-btn{
  width:100%;
  margin-top:5px;
  cursor:pointer;
}
.submit-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
}
.status{
  display:none;
  margin-top:16px;
  padding:13px 15px;
  border-radius:12px;
  font-size:13px;
  line-height:1.5;
}
.status.show{display:block}
.status.error{
  border:1px solid rgba(255,90,90,.3);
  background:rgba(255,60,60,.08);
  color:#ffb0b0;
}
.status.success{
  border:1px solid rgba(80,227,154,.3);
  background:rgba(80,227,154,.08);
  color:#9ff2c4;
}
.account-footer{
  margin-top:24px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}
.account-footer a{
  color:var(--cyan);
  font-weight:700;
}
.back-home{
  display:inline-flex;
  margin-bottom:18px;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
}
.back-home:hover{color:var(--cyan)}
.forgot{
  display:block;
  margin-top:10px;
  text-align:right;
  color:var(--cyan);
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}
.forgot:hover{text-decoration:underline}
@media(max-width:600px){
  .account-page{padding:90px 15px 40px}
  .account-card{padding:27px 20px}
}
</style>
</head>

<body>

<main class="account-page">

  <div class="account-wrap">

    <a class="back-home" href="../index.html">
      ← Back to home
    </a>

    <div class="account-logo">
      <img
        src="../static/assets/logo.png"
        alt="Zakmolanitech Solutions"
      >
    </div>

    <section class="account-card">

      <span class="eyebrow">ACCOUNT ACCESS</span>

      <h1>Welcome back</h1>

      <p class="intro">
        Sign in to continue to your Zakmolanitech Solutions account.
      </p>

      <form id="signinForm" novalidate>

        <div class="form-field">

          <label for="email">
            Email address
          </label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >

        </div>


        <div class="form-field">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Your password"
            required
          >

          <a
            class="forgot"
            id="forgotPassword"
            href="#"
          >
            Forgot password?
          </a>

        </div>


        <button
          id="signinButton"
          class="btn btn-primary submit-btn"
          type="submit"
        >
          Sign In
        </button>


        <div
          id="status"
          class="status"
          role="alert"
        ></div>

      </form>


      <div class="account-footer">

        Don't have an account?

        <a href="signup.html">
          Create one
        </a>

      </div>

    </section>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://julhswsijtcoyjrjrobk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_a0qKsqBB0hR9BOWpP3dkwg_7nUOmXYC";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const form =
  document.getElementById("signinForm");

const button =
  document.getElementById("signinButton");

const statusBox =
  document.getElementById("status");


function showStatus(message,type){

  statusBox.textContent = message;

  statusBox.className =
    "status show " + type;

}


/* -----------------------------------------
   CLEAN SUPABASE AUTH ERROR URL
----------------------------------------- */

(function handleAuthUrl(){

  const hash =
    window.location.hash;

  if(!hash){
    return;
  }


  const params =
    new URLSearchParams(
      hash.substring(1)
    );


  const error =
    params.get("error");

  const errorCode =
    params.get("error_code");

  const description =
    params.get("error_description");


  /*
    Supabase can place authentication
    errors in the URL hash.

    Remove the hash immediately so users
    never see the long technical URL.
  */

  if(error || errorCode || description){

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname +
      window.location.search
    );


    if(
      errorCode === "otp_expired" ||
      (
        description &&
        description
          .toLowerCase()
          .includes("expired")
      )
    ){

      showStatus(
        "Your email confirmation link has expired. Please request a new confirmation email.",
        "error"
      );

    }else{

      showStatus(
        "The email confirmation link is invalid. Please request a new one.",
        "error"
      );

    }

  }

})();


/* -----------------------------------------
   CHECK EXISTING SESSION
----------------------------------------- */

async function checkExistingSession(){

  try{

    const {data,error} =
      await supabaseClient.auth.getSession();


    if(error){
      console.error(error);
      return;
    }


    if(data && data.session){

      window.location.replace(
        "dashboard.html"
      );

    }

  }catch(error){

    console.error(
      "Session check error:",
      error
    );

  }

}


checkExistingSession();


/* -----------------------------------------
   SIGN IN
----------------------------------------- */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    if(!email || !password){

      showStatus(
        "Please enter your email and password.",
        "error"
      );

      return;

    }


    button.disabled = true;
    button.textContent = "Signing in...";


    try{

      const {data,error} =
        await supabaseClient.auth
          .signInWithPassword({

            email:email,
            password:password

          });


      if(error){

        /*
          Give a cleaner message for common
          authentication failures.
        */

        const message =
          error.message || "";


        if(
          message
            .toLowerCase()
            .includes("email not confirmed")
        ){

          throw new Error(
            "Please confirm your email address before signing in."
          );

        }


        throw error;

      }


      if(
        !data ||
        !data.session
      ){

        throw new Error(
          "Login was not completed. Please try again."
        );

      }


      showStatus(
        "Login successful. Opening your account...",
        "success"
      );


      setTimeout(function(){

        window.location.replace(
          "dashboard.html"
        );

      },350);


    }catch(error){

      console.error(
        "Signin error:",
        error
      );


      showStatus(
        error.message ||
        "Unable to sign in. Please check your details.",
        "error"
      );


      button.disabled = false;
      button.textContent = "Sign In";

    }

  }
);


/* -----------------------------------------
   PASSWORD RESET
----------------------------------------- */

document
  .getElementById("forgotPassword")
  .addEventListener(
    "click",
    async function(event){

      event.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      if(!email){

        showStatus(
          "Enter your email address first, then select Forgot password.",
          "error"
        );

        return;

      }


      const resetButton = this;

      resetButton.style.pointerEvents =
        "none";


      try{

        const {error} =
          await supabaseClient.auth
            .resetPasswordForEmail(
              email,
              {
                redirectTo:
                  window.location.origin +
                  "/Zakmolanitech-Solutions-official-site/templates/settings.html"
              }
            );


        if(error){
          throw error;
        }


        showStatus(
          "Password reset instructions have been sent to your email.",
          "success"
        );


      }catch(error){

        console.error(
          "Password reset error:",
          error
        );


        showStatus(
          error.message ||
          "Unable to send the password reset email.",
          "error"
        );


      }finally{

        setTimeout(function(){

          resetButton.style.pointerEvents =
            "";

        },1000);

      }

    }
  );

</script>

</body>
  </html>
